name: dquote
description: "台股／美股報價、匯率、持股損益與提醒（Android first）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- 網路與資料（報價來源：Yahoo Finance chart API，非官方）---
  dio: ^5.11.1

  # --- 本地資料庫：Instruments / Holdings / CashPosition / Candles / Alerts / AlertLog / Setting ---
  # libsqlite3.so 由 sqlite3 3.8+ 的 native-assets hook 提供，**不要**加 sqlite3_flutter_libs。
  drift: ^2.35.4
  path: ^1.9.1                    # drift 建議一起列（db 檔路徑组合）
  path_provider: ^2.1.6

  # --- UI ---
  fl_chart: ^1.3.1          # 走勢圖、走勢縮圖、資產配置環形圖（純 Dart）
  provider: ^6.1.5+1        # 狀態（清單資料走 drift Stream，不需要 ChangeNotifier）
  get_it: ^9.3.0            # DI，與同 family 專案同構
  intl: ^0.20.3             # MoneyFormatter / 日期；版號須與 flutter_localizations 對齊

  # --- 排程與通知 ---
  workmanager: ^0.10.10     # 15 分鐘 heartbeat（Android 12+ 下限；iOS 走 BGTaskScheduler 同套件）
  awesome_notifications: ^0.12.1   # 三 channel 提醒；也自帶 POST_NOTIFICATIONS 權限請求，
                                   # 所以**不裝** permission_handler

  # --- 桌面 widget（原生端 Kotlin Glance；iOS 端留 WidgetKit 空間）---
  home_widget: ^0.10.0

  # --- 小工具 ---
  package_info_plus: ^10.2.2   # 關於頁版號
  url_launcher: ^6.3.3         # 「開啟電池最佳化設定」等系統頁

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0        # analysis_options.yaml include 它，沒列會 include_file_not_found
  drift_dev: ^2.35.3           # 必須與 drift 版一致
  build_runner: ^2.17.1
  # 測試只用 flutter_test + 手寫 fake（**不裝** mockito：會連帶鎖 build_runner/test 版，
  # 這是同 family 專案踩過的版本地獄）

flutter:
  generate: true
  uses-material-design: true
